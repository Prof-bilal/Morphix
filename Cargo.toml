# Morphix workspace.
#
# `crates/morphix-core` holds every domain rule and must build without Tauri, a GUI
# toolkit, or a display server (ARCHITECTURE.md §3, §5).
#
# The Tauri shell requires WebKitGTK 4.1 development headers at build time; on Arch-based
# systems that is the `webkit2gtk-4.1` package (PHASE0.md §2).

[workspace]
resolver = "3"
members = ["crates/morphix-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Prof-bilal/Morphix"
description = "Safe, reversible customization for KDE Plasma 6."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
tracing = "0.1"
# `fmt` (and its `registry`/`std` dependency) plus `ansi` only. No `env-filter`, no
# `json`, no `tracing-log`: the log surface stays small and file-based (SECURITY.md §13).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

# Only rules that are safe for every target belong here. The panic-free rules
# (`clippy::unwrap_used`, `expect_used`, `panic`, `todo`, `unimplemented`) are declared in
# `crates/morphix-core/src/lib.rs` instead, so integration tests can still fail loudly.
[workspace.lints.rust]
unsafe_code = "forbid"
