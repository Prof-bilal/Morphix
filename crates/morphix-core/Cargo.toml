[package]
name = "morphix-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Morphix domain engine: detection, packs, planning, snapshots, transactions, KDE adapter."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
# Safe syscall wrapper for the mutation lock only (fs feature: flock, nothing
# else). Already in the dependency tree via tempfile; no new supply chain.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
